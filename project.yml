name: FitbitHealthSync
options:
  bundleIdPrefix: com.praveenmurugesan
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
packages: {}
targets:
  FitbitHealthSync:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FitbitHealthSync
    info:
      path: FitbitHealthSync/Resources/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - com.praveenmurugesan.FitbitHealthSync.refresh
          - com.praveenmurugesan.FitbitHealthSync.processing
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.praveenmurugesan.fitbithealthsync
            CFBundleURLSchemes:
              - fitbithealthsync
          - CFBundleTypeRole: Editor
            CFBundleURLName: google-health-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.547556030049-csoh2cpvu82k3ub8b0gie0gk2k7mhhgc
        NSHealthShareUsageDescription: Reads health permissions and sync status.
        NSHealthUpdateUsageDescription: Writes Fitbit / Google Health data into Apple Health.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - fetch
          - processing
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    entitlements:
      path: FitbitHealthSync/Resources/FitbitHealthSync.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.praveenmurugesan.FitbitHealthSync
        INFOPLIST_KEY_CFBundleDisplayName: "Fitbit Health Sync"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    prebuildScripts: []
    dependencies: []

  FitbitHealthSyncTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FitbitHealthSyncTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.praveenmurugesan.FitbitHealthSyncTests
    dependencies:
      - target: FitbitHealthSync
